name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Serves the site at https://sammokazemi.github.io/portfolio.
          # With a custom domain, set SITE_URL to it and BASE_PATH to "/".
          SITE_URL: https://sammokazemi.github.io
          BASE_PATH: /portfolio
          # Contact form backend (worker/README.md). Public values, set under
          # Settings → Secrets and variables → Actions → Variables. While unset,
          # the form asks visitors to email instead.
          PUBLIC_CONTACT_API_URL: ${{ vars.CONTACT_API_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
